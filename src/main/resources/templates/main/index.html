<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>GamePan 메인</title>
    <link rel="stylesheet" th:href="@{/css/header.css}" />
    <link rel="stylesheet" th:href="@{/css/main.css}" />
</head>
<body>

<!-- 🔹 헤더 -->
<div th:replace="~{fragments/header :: siteHeader}"></div>

<main class="container">

    <!-- ✅ 게시판 전체 -->
    <section class="board-grid" th:if="${boards != null}">
        <div class="board" th:each="board : ${boards}">
            <div class="board-header">
                <h3 th:text="${board.name}">게시판 이름</h3>
                <a th:href="@{'/boards/' + ${board.id} + '/posts'}" class="more">더보기 ▸</a>
            </div>

            <!-- ✅ 카드 2x2 고정 -->
            <div class="post-grid"
                 th:with="posts=${postsByBoard != null ? postsByBoard[board.id] : {}}">
                <div class="card"
                     th:each="post, iterStat : ${posts}"
                     th:if="${iterStat.index < 4}">
                    <div class="no-thumbnail">이미지 없음</div>
                    <div class="card-body">
                        <a class="title"
                           th:href="@{'/boards/' + ${board.id} + '/posts/' + ${post.id}}"
                           th:text="${post.title}">게시글 제목</a>
                        <div class="meta">
                            <span th:text="${#temporals.format(post.createdAt, 'yyyy.MM.dd')}">2025.10.31</span>
                            · <span th:text="'조회 ' + ${post.viewCount}">조회수</span>
                        </div>
                    </div>
                </div>

                <!-- 게시글이 없는 경우 -->
                <div class="card empty" th:if="${#lists.isEmpty(posts)}">
                    <div class="no-thumbnail">게시글 없음</div>
                    <div class="card-body"><span>등록된 게시글이 없습니다.</span></div>
                </div>
            </div>

            <!-- ✅ 하단 최신 게시글 목록 (❤️, 💬 포함) -->
            <div class="post-list-section">
                <div class="list-header"><span class="list-title">최신 게시글</span></div>
                <ul class="post-list"
                    th:with="recentPosts=${postsByBoard != null ? postsByBoard[board.id] : {}}">
                    <li th:each="post, iterStat : ${recentPosts}" th:if="${iterStat.index < 5}">
                        <a th:href="@{'/boards/' + ${board.id} + '/posts/' + ${post.id}}"
                           th:text="${post.title}">게시글 제목</a>
                        <div class="post-info">
                            <span class="like">❤️ <span th:text="${post.likeCount}">0</span></span>
                            <span class="comment">💬 <span th:text="${post.commentCount}">0</span></span>
                            <span class="date" th:text="${#temporals.format(post.createdAt, 'MM.dd')}">10.31</span>
                        </div>
                    </li>
                    <li th:if="${#lists.isEmpty(recentPosts)}" class="empty">등록된 게시글이 없습니다.</li>
                </ul>
            </div>
        </div>
    </section>

    <!-- 게시판 없을 때 -->
    <section th:if="${#lists.isEmpty(boards)}">
        <p class="text-muted text-center mt-5">아직 생성된 게시판이 없습니다.</p>
    </section>
</main>

<footer>
    <div class="footer">© 2025 GamePan Board. All rights reserved.</div>
</footer>

</body>
</html>
