<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title th:text="${board.name + ' 게시판 - 게시글 작성'}">게시글 작성 - GamePan</title>
    <link rel="stylesheet" th:href="@{/css/header.css}" />
    <link rel="stylesheet" th:href="@{/css/post-form.css}" />
    <link rel="stylesheet" th:href="@{/css/footer.css}" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<!-- 🔹 헤더 -->
<div th:replace="~{fragments/header :: siteHeader}"></div>

<!-- 🔹 게시판 이름 및 돌아가기 -->
<div class="container mb-4">
    <a th:href="@{|/boards/${board.id}/posts|}" class="text-muted small text-decoration-none">← 게시판으로 돌아가기</a>
    <h3 class="fw-bold text-dark mt-3" th:text="${board.name} + ' 게시글 작성'">게시글 작성</h3>
</div>

<!-- 🔹 게시글 작성 폼 -->
<div class="container bg-white p-4 rounded shadow-sm">
    <form th:action="@{|/boards/${board.id}/posts|}" method="post" th:object="${postRequestDto}">
        <!-- 제목 -->
        <div class="mb-3">
            <label for="title" class="form-label fw-semibold">제목</label>
            <input type="text" id="title" th:field="*{title}" class="form-control" placeholder="제목을 입력하세요" required>
        </div>

        <!-- 내용 -->
        <div class="mb-3">
            <label for="content" class="form-label fw-semibold">내용</label>
            <textarea id="content" th:field="*{content}" class="form-control" rows="10" placeholder="내용을 입력하세요" required></textarea>
        </div>

        <!-- 이미지 업로드 자리 (기능구현 나중에) -->
        <div class="mb-4">
            <label class="form-label fw-semibold">이미지</label>
            <div class="image-placeholder">
                <p>🖼 이미지 업로드 기능은 추후 추가 예정입니다</p>
            </div>
        </div>

        <!-- 버튼 -->
        <div class="d-flex justify-content-end mt-4">
            <a th:href="@{|/boards/${board.id}/posts|}" class="btn btn-secondary me-2">취소</a>
            <button type="submit" class="btn btn-primary">등록</button>
        </div>
    </form>
</div>

<!-- 🔹 푸터 -->
<div th:replace="~{fragments/footer :: siteFooter}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
