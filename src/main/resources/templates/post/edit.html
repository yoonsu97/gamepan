<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title th:text="${board.name + ' 게시판 - 게시글 수정'}">게시글 수정 - GamePan</title>

    <link rel="stylesheet" th:href="@{/css/header.css}" />
</head>
<body class="bg-light">
<div th:replace="~{fragments/header :: siteHeader}"></div>

<!-- 🔹 페이지 제목 -->
<div class="container mb-4">
    <a th:href="@{|/boards/${boardId}/posts/${postId}|}" class="text-muted small text-decoration-none">
        ← 게시글로 돌아가기
    </a>
    <h3 class="fw-bold text-dark mt-3" th:text="${board.name} + ' 게시글 수정'">게시글 수정</h3>
</div>

<!-- 🔹 수정 폼 -->
<div class="container bg-white p-4 rounded shadow-sm">
    <form th:action="@{|/boards/${boardId}/posts/${postId}/edit|}" method="post" th:object="${postRequestDto}">
        <div class="mb-3">
            <label for="title" class="form-label fw-semibold">제목</label>
            <input type="text" id="title" th:field="*{title}" class="form-control" required>
        </div>

        <div class="mb-3">
            <label for="content" class="form-label fw-semibold">내용</label>
            <textarea id="content" th:field="*{content}" class="form-control" rows="10" required></textarea>
        </div>

        <div class="d-flex justify-content-end mt-4">
            <a th:href="@{|/boards/${boardId}/posts/${postId}|}" class="btn btn-secondary me-2">취소</a>
            <button type="submit" class="btn btn-primary">수정 완료</button>
        </div>
    </form>
</div>

<!-- 🔹 푸터 -->
<footer class="bg-white border-top py-3 mt-5">
    <div class="container text-center text-muted small">
        © 2025 GamePan Board. All rights reserved.
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
