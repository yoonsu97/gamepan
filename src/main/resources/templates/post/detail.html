<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title th:text="${post.title}">게시글 상세</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #fafafa; font-family: 'Noto Sans KR', sans-serif; }
        header { border-bottom: 1px solid #ddd; margin-bottom: 10px; background-color: #fff; }
        .header-top { display: flex; justify-content: flex-end; align-items: center; padding: 5px 40px 0; font-size: 0.9rem; }
        .header-top a { text-decoration: none; color: black; margin-left: 15px; }
        .header-main { display: flex; justify-content: space-between; align-items: center; padding: 10px 40px 0; }
        .header-main .left { display: flex; align-items: center; }
        .header-main img { margin-right: 10px; }
        .header-nav a { text-decoration: none; color: black; font-weight: 600; margin-right: 25px; }
        .post-box { background: #fff; border-radius: 10px; padding: 30px; box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05); margin: 0 auto 40px; max-width: 800px; }
        .post-image { background: #dcdcdc; border-radius: 8px; height: 300px; display: flex; align-items: center; justify-content: center; color: #333; font-weight: 500; }
        .like-btn { display: flex; justify-content: center; align-items: center; margin-top: 20px; }
        .like-btn button { border: 1px solid #ccc; background: white; border-radius: 8px; padding: 6px 18px; cursor: pointer; transition: 0.2s; }
        .like-btn button:hover { background: #f3f3f3; }
        .comment-box { background: #fff; border-radius: 10px; padding: 25px; max-width: 800px; margin: 0 auto 60px; box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05); }
        footer { text-align: center; color: #777; margin-top: 60px; margin-bottom: 30px; }
        .comment-header { display: flex; justify-content: space-between; align-items: center; font-size: 0.9rem; }
        .comment-header a { text-decoration: none; color: #666; margin-left: 5px; }
        .comment-header a:hover { text-decoration: underline; }
    </style>
</head>
<body>

<header>
    <div class="header-top">
        <a href="#">회원정보</a> |
        <a href="#">고객센터</a> |
        <a href="/login">로그인</a>
    </div>

    <div class="header-main">
        <div class="left">
            <img src="/images/gamepad.png" alt="로고" width="35">
            <h3 class="fw-bold mb-0">GamePan</h3>
        </div>

        <nav class="header-nav">
            <a href="/">홈</a>
            <a th:href="@{|/boards/${board.id}/posts|}">게시글 목록</a>
            <a href="/mypage">마이페이지</a>
        </nav>
    </div>
</header>

<main>
    <div class="post-box">
        <div class="text-muted small d-flex justify-content-between">
            <span th:text="${#temporals.format(post.createdAt, 'yyyy-MM-dd HH:mm')}">2025-10-29 14:00</span>
            <span>조회 <span th:text="${post.viewCount}">0</span></span>
        </div>

        <hr>

        <h3 th:text="${post.title}" class="fw-bold mb-3">게시글 제목</h3>

        <div class="post-image mb-4">
            글 및 이미지
        </div>

        <div th:text="${post.content}" class="mb-4">게시글 내용입니다.</div>

        <!-- 좋아요 -->
        <div class="like-btn">
            <form th:action="@{|/boards/${board.id}/posts/${post.id}/like|}" method="post">
                <button type="submit">❤️ <span th:text="${post.likeCount}">0</span></button>
            </form>
        </div>
    </div>

    <!-- ✅ 수정/삭제 버튼 -->
    <div class="d-flex justify-content-end mt-3" style="max-width: 800px; margin: 0 auto;">
        <a th:href="@{|/boards/${board.id}/posts/${post.id}/edit|}" class="btn btn-outline-secondary me-2">수정</a>

        <form th:action="@{|/boards/${board.id}/posts/${post.id}/delete|}" method="post" class="d-inline">
            <button type="submit" class="btn btn-outline-danger">삭제</button>
        </form>
    </div>

    <div class="comment-box">
        <div class="comment-header mb-3">
            <div>
                <strong>댓글</strong>
                <span th:text="'(' + ${#lists.size(comments)} + ')'">(0)</span>
            </div>
            <div>
                <a href="#">좋아요순</a> |
                <a href="#">최신순</a>
            </div>
        </div>

        <hr>

        <div th:each="comment : ${comments}" class="mb-3 border-bottom pb-2">
            <p class="mb-1"><strong th:text="${comment.user.nickname}">닉네임</strong></p>
            <p th:text="${comment.content}">댓글 내용입니다.</p>
        </div>

        <!-- 댓글 등록 -->
        <form th:action="@{|/boards/${board.id}/posts/${post.id}/comments|}" method="post" class="mt-3">
            <div class="input-group">
                <input type="text" name="content" class="form-control" placeholder="댓글을 입력하세요">
                <button type="submit" class="btn btn-dark">등록</button>
            </div>
        </form>
    </div>
</main>

<footer>
    © 2025 GamePan | All rights reserved.
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
