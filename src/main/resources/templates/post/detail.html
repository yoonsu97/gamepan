<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title th:text="${post.title}">게시글 상세</title>
    <link rel="stylesheet" th:href="@{/css/header.css}" />
    <link rel="stylesheet" th:href="@{/css/post-detail.css}" />
    <link rel="stylesheet" th:href="@{/css/footer.css}" />
</head>
<body>
<div th:replace="~{fragments/header :: siteHeader}"></div>

<main id="postDetail" class="container mt-4" th:attr="data-board-id=${board.id},data-post-id=${post.id}">

    <!-- ✅ 게시판 목록으로 돌아가기 -->
    <div class="container">
        <a th:href="@{|/boards/${board.id}/posts|}" class="back-to-list">
            ← 목록으로
        </a>
    </div>

    <!-- 이미 신고한 경우: 문구만 표시 -->
    <div th:if="${alreadyReported}">
        <p style="color:#d9534f; font-weight:600;">신고한 게시물입니다.</p>
    </div>

    <!-- 아직 신고 안 한 경우: 신고 버튼 -->
    <form th:if="${!alreadyReported}"
          th:action="@{'/boards/' + ${post.board.id} + '/posts/' + ${post.id} + '/report'}"
          method="post">
        <button type="submit">신고하기</button>
    </form>

    <div class="post-box">
        <!-- 🔹 작성일 / 조회수 -->
        <div class="text-muted small d-flex justify-content-between">
            <span th:text="${#temporals.format(post.createdAt, 'yyyy-MM-dd HH:mm')}">2025-10-29 14:00</span>
            <span>조회 <span th:text="${post.viewCount}">0</span></span>
        </div>

        <hr>

        <!-- 🔹 제목 + (작성자만 수정/삭제 버튼 표시) -->
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h3 th:text="${post.title}" class="fw-bold mb-0">게시글 제목</h3>

            <!-- ✅ 게시글 작성자만 수정/삭제 -->
            <div th:if="${#authentication.principal != null
                        and #authentication.principal.user.id == post.user.id}"
                 class="post-actions d-flex gap-2">
                <a th:href="@{|/boards/${board.id}/posts/${post.id}/edit|}"
                   class="btn btn-outline-secondary btn-sm">수정</a>

                <form th:action="@{|/boards/${board.id}/posts/${post.id}/delete|}"
                      method="post" class="d-inline">
                    <button type="submit" class="btn btn-outline-danger btn-sm">삭제</button>
                </form>
            </div>
        </div>

        <!-- 🔹 본문 -->
        <div class="post-image mb-4">글 및 이미지</div>
        <div th:text="${post.content}" class="mb-4">게시글 내용입니다.</div>

        <!-- 🔹 좋아요 (AJAX로 토글) -->
        <div class="like-btn">
            <button id="likeButton"
                    th:data-post-id="${post.id}"
                    class="btn btn-outline-danger">
                ❤️ <span id="likeCount" th:text="${post.likeCount}">0</span>
            </button>
        </div>
    </div>

    <!-- 🔹 댓글 영역 -->
    <div class="comment-box">
        <div class="comment-header mb-3">
            <div>
                <strong>댓글</strong>
                <span th:text="'(' + ${#lists.size(comments)} + ')'">(0)</span>
            </div>
            <div>
                <a href="#">좋아요순</a> |
                <a href="#">최신순</a>
            </div>
        </div>

        <hr>

        <!-- 댓글 리스트 -->
        <div th:each="comment : ${comments}" class="comment-item"
             th:attr="data-comment-id=${comment.id}">

            <div class="comment-top">
                <p class="comment-author mb-1" th:text="${comment.user.nickname}">닉네임</p>

                <!-- ✅ 작성자만 수정/삭제 버튼 -->
                <div th:if="${#authentication.principal != null
                    and #authentication.principal.user.id == comment.user.id}"
                     class="comment-actions">
                    <button type="button" class="btn btn-outline-secondary btn-sm edit-btn">수정</button>
                    <form th:action="@{|/boards/${board.id}/posts/${post.id}/comments/${comment.id}/delete|}"
                          method="post" class="d-inline">
                        <button type="submit" class="btn btn-outline-danger btn-sm">삭제</button>
                    </form>
                </div>
            </div>

            <!-- 댓글 내용 -->
            <p class="comment-content" th:text="${comment.content}">댓글 내용입니다.</p>
        </div>

        <!-- 🔹 댓글 등록 -->
        <form th:action="@{|/boards/${board.id}/posts/${post.id}/comments|}" method="post" class="comment-form mt-3">
            <div class="input-group">
                <textarea name="content" placeholder="댓글을 입력하세요"></textarea>
                <button type="submit">등록</button>
            </div>
        </form>
    </div>
</main>

<div th:replace="~{fragments/footer :: siteFooter}"></div>

<script src="/js/post-detail.js"></script>

</body>
</html>
