<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title th:text="${post.title}">게시글 상세</title>
    <link rel="stylesheet" th:href="@{/css/header.css}" />
    <link rel="stylesheet" th:href="@{/css/post-detail.css}" />
</head>
<body>
<div th:replace="~{fragments/header :: siteHeader}"></div>

<main class="container mt-4">

    <!-- ✅ 게시판 목록으로 돌아가기 -->
    <div class="container">
        <a th:href="@{|/boards/${board.id}/posts|}" class="back-to-list">
            ← 목록으로
        </a>
    </div>

    <!-- 이미 신고한 경우: 문구만 표시 -->
    <div th:if="${alreadyReported}">
        <p style="color:#d9534f; font-weight:600;">신고한 게시물입니다.</p>
    </div>

    <!-- 아직 신고 안 한 경우: 신고 버튼 -->
    <form th:if="${!alreadyReported}"
          th:action="@{'/boards/' + ${post.board.id} + '/posts/' + ${post.id} + '/report'}"
          method="post">
        <button type="submit">신고하기</button>
    </form>

    <div class="post-box">
        <!-- 🔹 작성일 / 조회수 -->
        <div class="text-muted small d-flex justify-content-between">
            <span th:text="${#temporals.format(post.createdAt, 'yyyy-MM-dd HH:mm')}">2025-10-29 14:00</span>
            <span>조회 <span th:text="${post.viewCount}">0</span></span>
        </div>

        <hr>

        <!-- 🔹 제목 + (작성자만 수정/삭제 버튼 표시) -->
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h3 th:text="${post.title}" class="fw-bold mb-0">게시글 제목</h3>

            <!-- ✅ 게시글 작성자만 수정/삭제 -->
            <div th:if="${#authentication.principal != null
                        and #authentication.principal.user.id == post.user.id}"
                 class="post-actions d-flex gap-2">
                <a th:href="@{|/boards/${board.id}/posts/${post.id}/edit|}"
                   class="btn btn-outline-secondary btn-sm">수정</a>

                <form th:action="@{|/boards/${board.id}/posts/${post.id}/delete|}"
                      method="post" class="d-inline">
                    <button type="submit" class="btn btn-outline-danger btn-sm">삭제</button>
                </form>
            </div>
        </div>

        <!-- 🔹 본문 -->
        <div class="post-image mb-4">글 및 이미지</div>
        <div th:text="${post.content}" class="mb-4">게시글 내용입니다.</div>

        <!-- 🔹 좋아요 (AJAX로 토글) -->
        <div class="like-btn">
            <button id="likeButton"
                    th:data-post-id="${post.id}"
                    class="btn btn-outline-danger">
                ❤️ <span id="likeCount" th:text="${post.likeCount}">0</span>
            </button>
        </div>
    </div>

    <!-- 🔹 댓글 영역 -->
    <div class="comment-box">
        <div class="comment-header mb-3">
            <div>
                <strong>댓글</strong>
                <span th:text="'(' + ${#lists.size(comments)} + ')'">(0)</span>
            </div>
            <div>
                <a href="#">좋아요순</a> |
                <a href="#">최신순</a>
            </div>
        </div>

        <hr>

        <!-- 댓글 리스트 -->
        <div th:each="comment : ${comments}" class="comment-item"
             th:attr="data-comment-id=${comment.id}">

            <div class="comment-top">
                <p class="comment-author mb-1" th:text="${comment.user.nickname}">닉네임</p>

                <!-- ✅ 작성자만 수정/삭제 버튼 -->
                <div th:if="${#authentication.principal != null
                    and #authentication.principal.user.id == comment.user.id}"
                     class="comment-actions">
                    <button type="button" class="btn btn-outline-secondary btn-sm edit-btn">수정</button>
                    <form th:action="@{|/boards/${board.id}/posts/${post.id}/comments/${comment.id}/delete|}"
                          method="post" class="d-inline">
                        <button type="submit" class="btn btn-outline-danger btn-sm">삭제</button>
                    </form>
                </div>
            </div>

            <!-- 댓글 내용 -->
            <p class="comment-content" th:text="${comment.content}">댓글 내용입니다.</p>
        </div>

        <!-- 🔹 댓글 등록 -->
        <form th:action="@{|/boards/${board.id}/posts/${post.id}/comments|}" method="post" class="comment-form mt-3">
            <div class="input-group">
                <textarea name="content" placeholder="댓글을 입력하세요"></textarea>
                <button type="submit">등록</button>
            </div>
        </form>
    </div>
</main>

<footer>
    © 2025 GamePan | All rights reserved.
</footer>

<!-- 🔹 좋아요 AJAX Script -->
<script>
    document.addEventListener("DOMContentLoaded", function() {
        // ======= 좋아요 토글 =======
        const likeButton = document.getElementById("likeButton");
        const likeCount = document.getElementById("likeCount");

        if (likeButton) {
            likeButton.addEventListener("click", function() {
                const postId = likeButton.dataset.postId;

                fetch(`/api/posts/${postId}/likes/toggle`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" }
                })
                    .then(res => res.json())
                    .then(data => {
                        if (data && data.data) {
                            const liked = data.data.liked;
                            const count = data.data.likeCount;

                            likeCount.textContent = count;
                            likeButton.textContent = liked ? "💖 " + count : "❤️ " + count;
                        }
                    })
                    .catch(() => alert("서버 오류가 발생했습니다."));
            });
        }

        // ======= 댓글 인라인 수정 =======
        document.querySelectorAll(".edit-btn").forEach(button => {
            button.addEventListener("click", function() {
                const commentItem = button.closest(".comment-item");
                const contentEl = commentItem.querySelector(".comment-content");
                const oldText = contentEl.textContent.trim();
                const boardId = "[[${board.id}]]";
                const postId = "[[${post.id}]]";
                const commentId = commentItem.dataset.commentId;

                // 수정폼 UI 생성
                const textarea = document.createElement("textarea");
                textarea.className = "form-control mb-2";
                textarea.value = oldText;

                const saveBtn = document.createElement("button");
                saveBtn.className = "btn btn-primary btn-sm me-2";
                saveBtn.textContent = "저장";

                const cancelBtn = document.createElement("button");
                cancelBtn.className = "btn btn-secondary btn-sm";
                cancelBtn.textContent = "취소";

                // 기존 내용 숨기고 폼 삽입
                contentEl.style.display = "none";
                contentEl.insertAdjacentElement("afterend", textarea);
                textarea.insertAdjacentElement("afterend", saveBtn);
                saveBtn.insertAdjacentElement("afterend", cancelBtn);

                // 저장 버튼 클릭 시 서버에 수정 요청
                saveBtn.addEventListener("click", function() {
                    const newContent = textarea.value.trim();
                    if (!newContent) return alert("내용을 입력하세요");

                    fetch(`/boards/${boardId}/posts/${postId}/comments/${commentId}/edit`, {
                        method: "POST",
                        headers: { "Content-Type": "application/x-www-form-urlencoded" },
                        body: `content=${encodeURIComponent(newContent)}`
                    })
                        .then(res => {
                            if (res.ok) {
                                contentEl.textContent = newContent;
                                // 폼 제거 후 복구
                                textarea.remove();
                                saveBtn.remove();
                                cancelBtn.remove();
                                contentEl.style.display = "block";
                            } else {
                                alert("댓글 수정 실패");
                            }
                        })
                        .catch(() => alert("서버 오류가 발생했습니다."));
                });

                // 취소 버튼
                cancelBtn.addEventListener("click", function() {
                    textarea.remove();
                    saveBtn.remove();
                    cancelBtn.remove();
                    contentEl.style.display = "block";
                });
            });
        });
    });
</script>
<!-- 🔹 textarea 자동 높이조절 -->
<script>
    document.addEventListener("DOMContentLoaded", function() {
        const textareas = document.querySelectorAll(".comment-form textarea");
        textareas.forEach(textarea => {
            textarea.style.overflow = "hidden";
            textarea.style.resize = "none";
            textarea.style.height = textarea.scrollHeight + "px";
            textarea.addEventListener("input", () => {
                textarea.style.height = "auto";
                textarea.style.height = textarea.scrollHeight + "px";
            });
        });
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
