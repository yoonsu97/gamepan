<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title th:text="${board.name + ' 게시판 - GamePan'}">게시판</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<!-- 🔹 헤더 -->
<header class="border-bottom pb-2 mb-4 bg-white shadow-sm">
    <div class="container d-flex justify-content-between align-items-center py-3">
        <div class="d-flex align-items-center">
            <img src="/images/gamepad.png" alt="GamePan 로고" width="36" class="me-2">
            <h2 class="fw-bold mb-0 text-primary">GamePan</h2>
        </div>
        <nav>
            <a href="/gamepan" class="text-dark me-3 fw-semibold text-decoration-none">홈</a>
            <a href="/mypage" class="text-dark me-3 fw-semibold text-decoration-none">마이페이지</a>
            <a href="/login" class="text-dark fw-semibold text-decoration-none">로그인</a>
        </nav>
    </div>
</header>

<!-- 🔹 게시판 이름 + 설명 -->
<div class="container mb-4">
    <h3 class="fw-bold text-dark" th:text="${board.name}">게시판 이름</h3>
    <p class="text-muted" th:text="${board.description}">게시판 설명</p>
</div>

<!-- 🔹 검색 + 글쓰기 버튼 -->
<div class="container d-flex justify-content-between align-items-center mb-3">
    <!-- 🔸 검색 폼 -->
    <form class="d-flex w-50" th:action="@{|/boards/${board.id}/posts|}" method="get">
        <input class="form-control me-2" type="search" placeholder="검색어를 입력하세요" name="keyword">
        <button class="btn btn-outline-primary" type="submit">검색</button>
    </form>

    <!-- 🔸 글쓰기 버튼 -->
    <a class="btn btn-primary" th:href="@{|/boards/${board.id}/posts/create|}">글쓰기</a>
</div>

<!-- 🔹 게시글 목록 테이블 -->
<div class="container">
    <table class="table table-hover align-middle bg-white shadow-sm">
        <thead class="table-primary text-center">
        <tr>
            <th style="width: 8%">번호</th>
            <th style="width: 40%">제목</th>
            <th style="width: 15%">작성자</th>
            <th style="width: 12%">좋아요</th>
            <th style="width: 12%">조회수</th>
            <th style="width: 13%">작성일</th>
        </tr>
        </thead>
        <tbody class="text-center">
        <tr th:each="post, stat : ${posts}">
            <td th:text="${stat.count}">1</td>
            <td class="text-start">
                <!-- ✅ 게시글 상세 페이지 링크 -->
                <a th:href="@{|/boards/${board.id}/posts/${post.id}|}"
                   th:text="${post.title}"
                   class="text-decoration-none text-dark fw-semibold"></a>
            </td>
            <td th:text="${post.user != null ? post.user.nickname : '익명'}">작성자</td>
            <td>❤️ <span th:text="${post.likeCount}">0</span></td>
            <td th:text="${post.viewCount}">0</td>
            <td th:text="${#temporals.format(post.createdAt, 'yyyy-MM-dd')}">2025-10-29</td>
        </tr>

        <!-- 게시글 없을 때 -->
        <tr th:if="${#lists.isEmpty(posts)}">
            <td colspan="6" class="text-muted py-4">등록된 게시글이 없습니다.</td>
        </tr>
        </tbody>
    </table>
</div>

<!-- 🔹 하단 푸터 -->
<footer class="bg-white border-top py-3 mt-5">
    <div class="container text-center text-muted small">
        © 2025 GamePan Board. All rights reserved.
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
