<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" th:href="@{/css/header.css}">
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body>
<div th:replace="~{fragments/header :: siteHeader}"></div>

<div class="auth-container">
    <div class="auth-card">
        <h2 class="auth-title">로그인</h2>

        <form th:action="@{/login}" method="post">

            <div class="form-group">
                <label for="username" class="form-label">아이디</label>
                <input id="username" class="form-input" type="text" name="username" required autofocus>
            </div>

            <div class="form-group">
                <label for="password" class="form-label">비밀번호</label>
                <input id="password" class="form-input" type="password" name="password" required>
            </div>

            <div class="actions">
                <button type="submit" class="btn btn-primary">로그인</button>
                <a th:href="@{/signup}" class="btn btn-outline">회원가입</a>
            </div>

            <div th:if="${param.error}" class="alert alert-error">
                로그인 실패: 사용자명 또는 비밀번호가 잘못되었습니다.
            </div>
            <div th:if="${param.logout}" class="alert alert-success">
                로그아웃 되었습니다.
            </div>
            <div th:if="${param.signup}" class="alert alert-success">
                회원가입이 완료되었습니다. 로그인해 주세요.
            </div>
            <div th:if="${param.reason}" class="alert alert-success">
                닉네임 변경으로 인해 자동 로그아웃되었습니다.
            </div>
            <div th:if="${param.passwordChanged}" class="alert alert-success">
                비밀번호가 변경되었습니다. 다시 로그인해 주세요.
            </div>
        </form>
    </div>
</div>
</body>
</html>
