<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Sign Up</title>
    <link rel="stylesheet" th:href="@{/css/header.css}">
    <link rel="stylesheet" th:href="@{/css/signup.css}">
</head>
<body>
<div th:replace="~{fragments/header :: siteHeader}"></div>

<div class="signup-container">
    <div class="signup-card">
        <h2 class="signup-title">회원가입</h2>

        <form th:action="@{/signup}" th:object="${form}" method="post">
            <div th:if="${#fields.hasGlobalErrors()}" class="global-error"
                 th:each="e : ${#fields.globalErrors()}" th:text="${e}"></div>

            <div class="form-group">
                <label>아이디(Username)</label>
                <input type="text" th:field="*{username}" required>
                <div th:if="${#fields.hasErrors('username')}" th:errors="*{username}" class="field-error"></div>
            </div>

            <div class="form-group">
                <label>닉네임(Nickname)</label>
                <input type="text" th:field="*{nickname}" required>
                <div th:if="${#fields.hasErrors('nickname')}" th:errors="*{nickname}" class="field-error"></div>
            </div>

            <div class="form-group">
                <label>이메일(Email)</label>
                <input type="email" th:field="*{email}" required>
                <div th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="field-error"></div>
            </div>

            <div class="form-group">
                <label>비밀번호(Password)</label>
                <input type="password" th:field="*{password}" required>
                <div th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="field-error"></div>
            </div>

            <div class="form-group">
                <label>비밀번호 확인</label>
                <input type="password" th:field="*{passwordConfirm}" required>
                <div th:if="${#fields.hasErrors('passwordConfirm')}" th:errors="*{passwordConfirm}" class="field-error"></div>
            </div>

            <div th:if="${signupError}" class="global-error" th:text="${signupError}"></div>

            <div class="actions">
                <button type="submit" class="btn btn-primary">회원가입</button>
                <a th:href="@{/login}" class="btn btn-outline">로그인으로 이동</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
