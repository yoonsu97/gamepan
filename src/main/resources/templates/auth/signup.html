<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Sign Up</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/footer.css}" />
</head>
<body>
<h2>회원가입</h2>

<form th:action="@{/signup}" th:object="${form}" method="post">
    <!-- CSRF -->
    <!--<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>-->

    <div th:if="${#fields.hasGlobalErrors()}" style="color:red;"
         th:each="e : ${#fields.globalErrors()}" th:text="${e}"></div>

    <div>
        <label>아이디(Username):</label>
        <input type="text" th:field="*{username}" required>
        <div th:if="${#fields.hasErrors('username')}" th:errors="*{username}" style="color:red;"></div>
    </div>

    <div>
        <label>닉네임(Nickname):</label>
        <input type="text" th:field="*{nickname}" required>
        <div th:if="${#fields.hasErrors('nickname')}" th:errors="*{nickname}" style="color:red;"></div>
    </div>

    <div>
        <label>이메일(Email):</label>
        <input type="email" th:field="*{email}" required>
        <div th:if="${#fields.hasErrors('email')}" th:errors="*{email}" style="color:red;"></div>
    </div>

    <div>
        <label>비밀번호(Password):</label>
        <input type="password" th:field="*{password}" required>
        <div th:if="${#fields.hasErrors('password')}" th:errors="*{password}" style="color:red;"></div>
    </div>

    <div>
        <label>비밀번호 확인:</label>
        <input type="password" th:field="*{passwordConfirm}" required>
        <div th:if="${#fields.hasErrors('passwordConfirm')}" th:errors="*{passwordConfirm}" style="color:red;"></div>
    </div>

    <div th:if="${signupError}">
        <p style="color:red;" th:text="${signupError}"></p>
    </div>

    <div>
        <button type="submit">회원가입</button>
        <a th:href="@{/login}">로그인으로 이동</a>
    </div>
</form>
<div th:replace="~{fragments/footer :: siteFooter}"></div>
</body>
</html>
