<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>게시판 관리</title>
    <link rel="stylesheet" th:href="@{/css/header.css}" />
    <link rel="stylesheet" th:href="@{/css/admin-user.css}">
</head>
<body>
<div th:replace="~{fragments/header :: siteHeader}"></div>

<h2>게시판 관리</h2>

<div th:if="${message}" style="color:#065f46; font-weight:600; margin-bottom:10px;" th:text="${message}"></div>

<form id="deleteForm" method="post">
    <div class="toolbar">
        <a th:href="@{/admin/boards/new}" class="primary"
           style="text-decoration:none; padding:7px 12px; border-radius:6px;">게시판 생성</a>
    </div>

    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>이름</th>
            <th>코드</th>
            <th>설명</th>
            <th>수정</th>
            <th>삭제</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="b : ${boards}">
            <td th:text="${b.id}">1</td>
            <td th:text="${b.name}">자유게시판</td>
            <td th:text="${b.code}">FREE</td>
            <td th:text="${b.description}">자유롭게 글을 써보세요</td>

            <!-- 수정 버튼 -->
            <td>
                <a th:href="@{'/admin/boards/' + ${b.id} + '/edit'}">수정</a>
            </td>

            <!-- ✅ 삭제 버튼 (개별 삭제) -->
            <td>
                <form th:action="@{'/admin/boards/' + ${b.id} + '/delete'}" method="post"
                      style="display:inline;"
                      onsubmit="return confirm('게시판을 삭제하시겠습니까?');">
                    <button type="submit" class="primary" style="background:#b91c1c; border-color:#b91c1c;">삭제</button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(boards)}">
            <td colspan="6">표시할 게시판이 없습니다.</td>
        </tr>
        </tbody>
    </table>
</form>

</body>
</html>
