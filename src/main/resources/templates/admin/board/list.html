<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/admin-layout :: layout(~{::content})}">

<div th:fragment="content" class="admin-board-page">

    <div class="page-header">
        <h2>게시판 관리</h2>
        <a th:href="@{/admin/boards/new}" class="btn-create">+ 새 게시판</a>
    </div>

    <div th:if="${message}" class="alert-message" th:text="${message}"></div>

    <div class="board-table-wrapper">
        <table class="board-table">
            <thead>
            <tr>
                <th style="width: 70px;">ID</th>
                <th style="width: 180px;">이름</th>
                <th style="width: 180px;">코드</th>
                <th>설명</th>
                <th style="width: 100px;">수정</th>
                <th style="width: 100px;">삭제</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="b : ${boards}">
                <td th:text="${b.id}">1</td>
                <td th:text="${b.name}">자유게시판</td>
                <td th:text="${b.code}">FREE</td>
                <td th:text="${b.description}">자유롭게 글을 써보세요</td>
                <td>
                    <a th:href="@{'/admin/boards/' + ${b.id} + '/edit'}" class="btn-edit">수정</a>
                </td>
                <td>
                    <form th:action="@{'/admin/boards/' + ${b.id} + '/delete'}"
                          method="post"
                          onsubmit="return confirm('게시판을 삭제하시겠습니까?');">
                        <button type="submit" class="btn-delete">삭제</button>
                    </form>
                </td>
            </tr>

            <tr th:if="${#lists.isEmpty(boards)}">
                <td colspan="6" class="empty-message">등록된 게시판이 없습니다.</td>
            </tr>
            </tbody>
        </table>
    </div>

</div>
</html>
