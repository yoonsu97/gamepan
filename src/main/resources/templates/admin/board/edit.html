<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/admin-layout :: layout(~{::content})}">

<h2>게시판 수정</h2>

<form th:action="@{'/admin/boards/' + ${board.id} + '/update'}" method="post" class="admin-form">
    <div class="form-group">
        <label>게시판 이름</label>
        <input type="text" name="name" th:value="${board.name}" required>
    </div>

    <div class="form-group">
        <label>게시판 코드</label>
        <input type="text" name="code" th:value="${board.code}" required>
    </div>

    <div class="form-group">
        <label>설명</label>
        <textarea name="description" rows="3" th:text="${board.description}"></textarea>
    </div>

    <div class="form-actions">
        <button type="submit" class="btn-save">수정</button>
        <a th:href="@{/admin/boards/list}" class="btn-cancel">취소</a>
    </div>
</form>

</html>
