<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/admin-layout :: layout(~{::content})}">
<!-- ↑ admin-layout.html의 layout(content) fragment에 현재 페이지의 content를 전달 -->

<th:block th:fragment="content">
    <div class="admin-board-form-page">
    <h2>게시판 수정</h2>

    <form th:action="@{'/admin/boards/' + ${board.id} + '/update'}" method="post">
        <div>
            <label>게시판 이름:</label><br>
            <input type="text" name="name" th:value="${board.name}" required>
        </div>
        <div>
            <label>게시판 코드:</label><br>
            <input type="text" name="code" th:value="${board.code}" required>
        </div>
        <div>
            <label>설명:</label><br>
            <textarea name="description" th:text="${board.description}" rows="3"></textarea>
        </div>
        <br>
        <button type="submit" class="primary">수정</button>
        <a th:href="@{/admin/boards}">취소</a>
    </form>
    </div>
</th:block>
</html>
