<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<nav class="header" th:fragment="siteHeader">
    <div class="container nav">

        <!-- 좌측: 로고 / 프로젝트명 -->
        <a class="brand" th:href="@{/gamepan}">GamePan</a>

        <!-- 우측: 로그인 상태별 메뉴 -->
        <div class="nav-right">

            <!-- ✅ 로그인 상태 -->
            <div sec:authorize="isAuthenticated()">
                <span th:text="${#authentication?.principal?.user?.nickname != null ?
                                #authentication.principal.user.nickname + '님' :
                                #authentication?.name + '님'}">
                    user님
                </span>

                <a class="header-btn" th:href="@{/gamepan}">홈</a>
                <a class="header-btn" th:href="@{/mypage}">마이페이지</a>

                <form th:action="@{/logout}" method="post" style="display:inline;">
                    <button type="submit" class="header-btn">로그아웃</button>
                </form>
            </div>

            <!-- ✅ 비로그인 상태 -->
            <div sec:authorize="!isAuthenticated()">
                <a class="header-btn" th:href="@{/gamepan}">홈</a>
                <a class="header-btn" th:href="@{/login}">로그인</a>
            </div>

            <!-- 관리자 바: 관리자에게만 노출 -->
            <a sec:authorize="hasRole('ADMIN')" class="btn" th:href="@{/admin}">
                관리자
            </a>
        </div>
    </div>
</nav>

</html>
