<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<ul th:each="user : ${users}">
    <li th:text="${user.id}"></li>
    <li><a th:href="@{'/users/'+ ${user.id}}" th:text="${user.username}"></a></li>
    <li th:text="${user.email}"></li>
</ul>
</body>
</html>
